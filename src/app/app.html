<div class="app-shell">

  <!-- ── Sidebar (desktop) ──────────────────────────────────────── -->
  <nav class="sidebar" aria-label="Main navigation">

    <!-- Logo lockup -->
    <a routerLink="/home" class="sidebar-brand" aria-label="Momento home">
      <svg class="brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M 67 20.56 A 34 34 0 1 1 33 20.56"
              stroke="var(--color-text-primary)" stroke-width="7" stroke-linecap="round"/>
        <circle cx="50" cy="16" r="6.5" fill="var(--color-accent)"/>
      </svg>
      <span class="brand-wordmark">Momento</span>
    </a>

    <!-- Nav links -->
    <ul class="sidebar-nav" role="list">
      <li>
        <a routerLink="/home" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M3 9.5L10 3l7 6.5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"
                  stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M7.5 18v-5.5h5V18" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
          Home
        </a>
      </li>
      <li>
        <a routerLink="/people" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="8" cy="7" r="3.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1 18c0-3.5 3.134-5 7-5s7 1.5 7 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="15" cy="6" r="2.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M14 13c2.5.4 4.5 1.6 4.5 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          People
        </a>
      </li>
      <li>
        <a routerLink="/events" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 1v4M13 1v4M3 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M7 12l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Events
        </a>
      </li>
      <li>
        <a routerLink="/memories" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 3h12v12l-6 3-6-3V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M4 3l6 3 6-3M10 6v12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Memories
        </a>
      </li>
      <li>
        <a routerLink="/timeline" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="3" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 1v4M13 1v4M3 8h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="7" cy="12" r="1" fill="currentColor"/>
            <circle cx="10" cy="12" r="1" fill="currentColor"/>
            <circle cx="13" cy="12" r="1" fill="currentColor"/>
          </svg>
          Timeline
        </a>
      </li>
      <li>
        <a routerLink="/settings" routerLinkActive="active" class="nav-link">
          <svg class="nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M4 5h12M4 10h12M4 15h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="5" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="13" cy="10" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="8" cy="15" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Settings
        </a>
      </li>
    </ul>

    <!-- Search -->
    <button type="button" class="sidebar-search-btn" (click)="ui.openSearch()">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
        <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Search
      <kbd class="sidebar-kbd">⌘K</kbd>
    </button>

    <!-- Add button -->
    <a [routerLink]="fabLink" class="sidebar-add-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      {{ fabLabel }}
    </a>

  </nav>

  <!-- ── Main content ───────────────────────────────────────────── -->
  <main class="content" id="main-content">

    <!-- ── Mobile top bar (hidden on desktop where sidebar exists) ── -->
    <header class="mobile-topbar">
      <a routerLink="/home" class="mobile-brand" aria-label="Momento home">
        <svg class="mobile-brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <path d="M 67 20.56 A 34 34 0 1 1 33 20.56"
                stroke="var(--color-text-primary)" stroke-width="7" stroke-linecap="round"/>
          <circle cx="50" cy="16" r="6.5" fill="var(--color-accent)"/>
        </svg>
        <span class="mobile-brand-name">Momento</span>
      </a>
      <button type="button" class="mobile-search-btn" (click)="ui.openSearch()" aria-label="Search" tooltip="Search" tooltipPos="bottom">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <router-outlet />
  </main>

  <!-- ── Mobile bottom nav ──────────────────────────────────────── -->
  <nav class="bottom-nav" aria-label="Mobile navigation">
    <a routerLink="/home" routerLinkActive="active" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M3 9.5L10 3l7 6.5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M7.5 18v-5.5h5V18" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="bottom-nav-label">Home</span>
    </a>
    <a routerLink="/people" routerLinkActive="active" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="8" cy="7" r="3.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M1 18c0-3.5 3.134-5 7-5s7 1.5 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="15" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M14 13c2.5.4 4.5 1.6 4.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="bottom-nav-label">People</span>
    </a>
    <a routerLink="/memories" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 3h12v12l-6 3-6-3V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M4 3l6 3 6-3M10 6v12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="bottom-nav-label">Memories</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="bottom-nav-item">
      <svg class="bottom-nav-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M4 5h12M4 10h12M4 15h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="8" cy="5" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="13" cy="10" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="8" cy="15" r="2" fill="var(--color-surface)" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="bottom-nav-label">Settings</span>
    </a>
  </nav>

  <!-- ── FAB (mobile only) ──────────────────────────────────────── -->
  <a [routerLink]="fabLink" class="fab" [attr.aria-label]="fabLabel" [tooltip]="fabLabel" tooltipPos="left">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </a>

  <!-- ── Search overlay ───────────────────────────────────────────── -->
  @if (ui.searchOpen()) {
    <app-search-overlay (closed)="ui.closeSearch()" />
  }

  <!-- ── Toast notifications ────────────────────────────────────── -->
  @if (ui.notifications().length > 0) {
    <div class="toast-stack" aria-live="polite" aria-atomic="false">
      @for (n of ui.notifications(); track n.id) {
        <div class="toast" [attr.data-type]="n.type">
          <span>{{ n.message }}</span>
          <button (click)="ui.dismiss(n.id)" aria-label="Dismiss" tooltip="Dismiss" tooltipPos="top" type="button">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      }
    </div>
  }

</div>
