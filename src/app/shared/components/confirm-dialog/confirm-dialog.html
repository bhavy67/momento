@if (open()) {
  <div class="dialog-backdrop" (click)="cancelled.emit()" aria-hidden="true"></div>
  <div
    class="dialog-card"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'dialog-title-' + title()"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
  >
    <h2 class="dialog-title" [id]="'dialog-title-' + title()">{{ title() }}</h2>
    @if (message()) {
      <p class="dialog-message">{{ message() }}</p>
    }
    <div class="dialog-actions">
      <button type="button" class="btn-cancel" cdkFocusInitial (click)="cancelled.emit()">Cancel</button>
      <button type="button" class="btn-confirm" [class.btn-danger]="danger()" (click)="confirmed.emit()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
}
