<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Momento">
  <title>Momento</title>
  <style>
    .ring { stroke: var(--logo-ring, #1C1C1A); }
    .gem  { fill:   var(--logo-gem,  #C96A2E); }
  </style>
  <!--
    The Ring: 300° arc, gap centered at 12 o'clock.
    Starts at 1 o'clock  (67, 20.56)  = center + 34 × (sin 30°, −cos 30°)
    Ends   at 11 o'clock (33, 20.56)  = center + 34 × (sin −30°, −cos −30°)
    large-arc-flag=1 because 300° > 180°; sweep-flag=1 for clockwise.
  -->
  <path class="ring"
        d="M 67 20.56 A 34 34 0 1 1 33 20.56"
        stroke-width="7"
        stroke-linecap="round"/>
  <!--
    The Gem: sits at 12 o'clock (50, 16), nestled in the 60° gap.
    Its radius (6.5) matches the ring's half-stroke, so it reads as a set stone.
  -->
  <circle class="gem" cx="50" cy="16" r="6.5"/>
</svg>
